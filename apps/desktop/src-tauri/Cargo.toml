[package]
name = "hexora-desktop"
description = "Tauri shell for the Hexora desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hexora_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hexora-types.workspace = true
hexora-storage.workspace = true
hexora-engine.workspace = true
hexora-http.workspace = true
hexora-proxy.workspace = true
hexora-repeater.workspace = true
hexora-authz.workspace = true
hexora-report.workspace = true
bytes.workspace = true
chrono.workspace = true
tokio.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
