# Nullhawk — reusable GitHub composite action.
#
# Renders a Nullhawk project's established findings as SARIF and leaves the file where a
# workflow can upload it to GitHub code scanning. It does not itself send traffic: a
# Nullhawk run is an engagement a person conducts, and this action turns the project that
# run produced into something the Security tab shows. Point it at a project directory a
# previous step created (checked in, restored from a cache, or downloaded as an
# artifact) and it produces `nullhawk.sarif`.
#
# Why SARIF and not a bespoke check: GitHub keys results by their `partialFingerprints`,
# and Nullhawk sets that to each finding's stable id. So a finding that was present last
# run and is present this run is recognised as the *same* finding rather than a new one,
# which is what makes "fail only on new findings" work without guessing.
name: "Nullhawk SARIF"
description: "Render a Nullhawk project's findings as SARIF for GitHub code scanning."
author: "Nullhawk contributors"

inputs:
  project:
    description: "Path to the Nullhawk project directory to report on."
    required: true
  output:
    description: "Where to write the SARIF file."
    required: false
    default: "nullhawk.sarif"
  severity:
    description: "Omit findings below this severity (info, low, medium, high, critical)."
    required: false
    default: ""
  nullhawk-version:
    description: "Nullhawk CLI version to install from crates. 'source' builds from the checked-out tree instead."
    required: false
    default: "source"

outputs:
  sarif-file:
    description: "The SARIF file that was written."
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - name: Install Rust
      if: inputs.nullhawk-version == 'source'
      uses: dtolnay/rust-toolchain@stable

    - name: Build Nullhawk from source
      if: inputs.nullhawk-version == 'source'
      shell: bash
      run: cargo build --release -p nullhawk-cli

    - name: Install Nullhawk from crates
      if: inputs.nullhawk-version != 'source'
      shell: bash
      run: cargo install nullhawk-cli --version "${{ inputs.nullhawk-version }}" --locked

    - name: Render SARIF
      shell: bash
      run: |
        set -euo pipefail
        # Prefer the source build when it exists, else the installed binary on PATH.
        NULLHAWK="./target/release/nullhawk"
        if [ ! -x "$NULLHAWK" ]; then NULLHAWK="nullhawk"; fi

        ARGS=(report "${{ inputs.project }}" --format sarif --output "${{ inputs.output }}")
        if [ -n "${{ inputs.severity }}" ]; then
          ARGS+=(--severity "${{ inputs.severity }}")
        fi
        "$NULLHAWK" "${ARGS[@]}"
        echo "Wrote ${{ inputs.output }}"
