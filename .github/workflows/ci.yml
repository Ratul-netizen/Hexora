name: CI

on:
  push:
    branches: [main]
  pull_request:

# Never let a failing check pass silently: this is a security tool.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same version as rust-toolchain.toml. Using @stable here would
      # install one compiler and then have cargo silently auto-install another,
      # which makes "works in CI" mean something different from "works locally".
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop crate needs Tauri's system dependencies (WebView2, WebKitGTK).
      # It is built in the `desktop` job instead, so a missing system library cannot
      # mask a real failure in the core crates.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude hexora-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude hexora-desktop

      - name: Build CLI
        run: cargo build -p hexora-cli --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      # The engine (Rust) and the UI (TypeScript) each hard-code the RPC contract version, and
      # nothing links them at compile time. When they drift, the desktop app refuses to start with
      # "Incompatible engine". This fails the build the moment they disagree, so the mismatch is
      # caught here instead of in a shipped installer.
      - name: RPC contract version — engine and UI must match
        shell: bash
        run: |
          engine=$(grep -oP 'RPC_CONTRACT_VERSION: u32 = \K[0-9]+' core/types/src/lib.rs)
          ui=$(grep -oP 'EXPECTED_RPC_CONTRACT_VERSION = \K[0-9]+' frontend/src/ipc.ts)
          echo "engine contract=$engine, ui contract=$ui"
          if [ -z "$engine" ] || [ -z "$ui" ]; then
            echo "::error::could not read one of the contract versions" >&2; exit 1
          fi
          if [ "$engine" != "$ui" ]; then
            echo "::error::RPC contract mismatch: engine=$engine, UI=$ui. Update EXPECTED_RPC_CONTRACT_VERSION in frontend/src/ipc.ts to match core/types/src/lib.rs." >&2
            exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: frontend

      - name: Check desktop shell
        run: cargo check -p hexora-desktop --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Fails on security advisories. Unmaintained-crate warnings are reported but do
      # not fail the build: they arrive through transitive dependencies we do not
      # control, and a permanently red audit job is one nobody reads. Any accepted
      # advisory must be recorded in docs/dependencies.md with its reasoning.
      - name: Audit
        run: cargo audit

  deny:
    name: Licence and supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Licences (a copyleft dependency the commercial tier could not ship), bans and
      # sources (a dependency pulled from somewhere we did not choose), plus advisories.
      # Policy lives in deny.toml.
      - name: cargo-deny
        run: cargo deny check

      # A software bill of materials — the dependency inventory procurement asks for. Not a
      # gate; it is generated and kept as a build artifact.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: warn

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential removed from the tip is still a credential.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
