name: Release

# Tag a commit `vX.Y.Z` to cut a release. Each OS runner builds the licensed CLI and the
# desktop installers, and everything is attached to a DRAFT GitHub release for review before
# it is published. Manual runs (workflow_dispatch) build the same artifacts against a branch,
# for a dry run without cutting a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The workflow creates a release and uploads assets to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # WebView2 is present on Windows runners and WKWebView on macOS; only Linux needs the
      # WebKitGTK stack Tauri bundles against.
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential

      # Built here explicitly (not left to tauri's beforeBuildCommand) so the release does not
      # depend on the working directory that command runs in.
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: frontend

      # The licence public key is embedded at build time. Set NULLHAWK_LICENSE_PUBKEY as a repo
      # secret (see docs/release.md); without it the build runs at the free tier.
      # macOS ships universal (Intel + Apple Silicon) binaries, so one download works on every
      # Mac. The two target toolchains are added here, before both the CLI build and the desktop
      # bundle, so tauri's `--target universal-apple-darwin` can lipo the app too.
      - name: Build CLI
        shell: bash
        env:
          NULLHAWK_LICENSE_PUBKEY: ${{ secrets.NULLHAWK_LICENSE_PUBKEY }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
            cargo build -p nullhawk-cli --release --target x86_64-apple-darwin
            cargo build -p nullhawk-cli --release --target aarch64-apple-darwin
          else
            cargo build -p nullhawk-cli --release
          fi

      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir -p cli-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/nullhawk.exe "cli-dist/nullhawk-${{ github.ref_name }}-windows-x86_64.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            lipo -create -output "cli-dist/nullhawk-${{ github.ref_name }}-macos-universal" \
              target/x86_64-apple-darwin/release/nullhawk \
              target/aarch64-apple-darwin/release/nullhawk
          else
            cp target/release/nullhawk "cli-dist/nullhawk-${{ github.ref_name }}-linux-x86_64"
          fi

      - name: Build & bundle desktop, publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          # Required by tauri-action to create and upload to the draft release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NULLHAWK_LICENSE_PUBKEY: ${{ secrets.NULLHAWK_LICENSE_PUBKEY }}
          # macOS code signing + notarization, and Tauri updater signing, are intentionally NOT
          # wired here: an *empty* APPLE_CERTIFICATE still makes tauri-action attempt a keychain
          # `security import`, which fails the macOS bundle. Leaving these unset means macOS
          # ad-hoc-signs the .app and the installers ship unsigned. To sign a GA build, add the
          # env vars back and set the matching repo secrets (see docs/release.md):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID,
          #   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        with:
          # The directory that holds src-tauri; the config's paths are relative to it.
          projectPath: apps/desktop/src-tauri
          # macOS: build a universal (Intel + Apple Silicon) app so one .dmg runs on every Mac.
          # Other OSes take no extra target argument.
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "Nullhawk ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # Attach the CLI binary to the same draft release the desktop bundles created. Each OS
      # uploads its own uniquely-named binary; --clobber lets a re-run replace it.
      - name: Attach CLI binary to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" cli-dist/* --clobber
