version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nullhawk-types.workspace = true
nullhawk-engine.workspace = true
nullhawk-storage.workspace = true
nullhawk-repeater.workspace = true
nullhawk-verify.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
nullhawk-types = { workspace = true, features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
