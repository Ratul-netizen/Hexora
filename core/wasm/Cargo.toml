[package]
name = "hexora-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hexora-ext.workspace = true
# A pure-Rust WASM interpreter: no native code generation, so the supply chain stays small and
# a module cannot reach outside the bytes we hand it — the sandbox is the absence of imports.
wasmi = "0.36"
serde_json.workspace = true

[dev-dependencies]
# Compiles WebAssembly text to bytes, so the runtime's tests need no external toolchain.
wat = "1"
