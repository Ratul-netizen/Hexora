[package]
name = "nullhawk-verify"
description = "Nullhawk's verification framework: a detector's suspicion and a finding's claim are different things, and only one of them can be stored"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nullhawk-types.workspace = true
nullhawk-engine.workspace = true
nullhawk-repeater.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
nullhawk-types = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
