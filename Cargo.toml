[workspace]
resolver = "2"
# Only crates that exist and build are listed. New crates are split out of
# `core/engine` as each milestone lands; see docs/architecture.md.
members = ["core/types", "core/storage", "core/engine", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Ratul-netizen/Hexora"
authors = ["Hexora contributors"]

[workspace.dependencies]
hexora-types = { path = "core/types" }
hexora-storage = { path = "core/storage" }
hexora-engine = { path = "core/engine" }

# Async runtime. Needed at M0 only for the engine trait signatures.
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Hashing (content-addressed blob store)
sha2 = "0.10"

# Utility
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
bytes = { version = "1.9", features = ["serde"] }

# Desktop shell
tauri = { version = "2.1", features = [] }
tauri-build = { version = "2.0", features = [] }

# Testing
tempfile = "3.14"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# Proxy and fuzzer work is unbearable with unoptimized dependencies, and this costs
# nothing after the first build.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
