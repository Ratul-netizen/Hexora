[workspace]
resolver = "2"
# Only crates that exist and build are listed. New crates are split out of
# `core/engine` as each milestone lands; see docs/architecture.md.
members = [
    "core/types",
    "core/storage",
    "core/engine",
    "core/http",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Ratul-netizen/Hexora"
authors = ["Hexora contributors"]

[workspace.dependencies]
hexora-types = { path = "core/types" }
hexora-storage = { path = "core/storage" }
hexora-engine = { path = "core/engine" }
hexora-http = { path = "core/http" }

# Async runtime. Needed at M0 only for the engine trait signatures.
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# TLS. Pinned to the `ring` provider rather than rustls 0.23's aws-lc-rs default:
# aws-lc-rs needs cmake and NASM at build time, which would make a Windows checkout
# fail for reasons that have nothing to do with Hexora.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
x509-parser = "0.16"

# Content decoding. A hostile server controls these bytes, so both are driven
# incrementally against Limits::check_decompression rather than decoded in one go.
flate2 = "1.0"
brotli = "7.0"

# Hashing (content-addressed blob store)
sha2 = "0.10"

# Utility
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
bytes = { version = "1.9", features = ["serde"] }

# Desktop shell
tauri = { version = "2.1", features = [] }
tauri-build = { version = "2.0", features = [] }

# Testing
tempfile = "3.14"
# Generates throwaway certificates so the TLS path is tested against a real local
# handshake rather than the internet.
rcgen = "0.13"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# Proxy and fuzzer work is unbearable with unoptimized dependencies, and this costs
# nothing after the first build.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
